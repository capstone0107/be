version: '3.8'

services:
    fastapi-app:
        build: .
        container_name: capstone-be
        ports:
            - '8000:8000'
        environment:
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - GOOGLE_API_KEY=${GOOGLE_API_KEY}
            - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
            - APP_NAME=FastAPI LangChain Application
            - DEBUG=True
            # --- MySQL 연결 설정 추가 ---
            - DATABASE_URL=mysql+pymysql://user:password@mysql-db/app_db
        volumes:
            - ./data:/app/data
            - ./chroma_db:/app/chroma_db
        restart: unless-stopped
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
        # MySQL 서비스가 준비될 때까지 기다리도록 설정
        depends_on:
            mysql-db:
                condition: service_healthy

    mysql-db:
        image: mysql:8.0
        container_name: mysql-database
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: app_db
            MYSQL_USER: user
            MYSQL_PASSWORD: password
            MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        volumes:
            - mysql_data:/var/lib/mysql # 영구 저장을 위한 볼륨
        restart: unless-stopped
        # 헬스 체크 설정: MySQL 컨테이너의 상태를 확인
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-u$$MYSQL_USER',
                    '-p$$MYSQL_PASSWORD',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

volumes:
    mysql_data:
